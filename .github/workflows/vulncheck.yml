# Vulnerability scan against the Go vulnerability database.
# Scheduled (new CVEs land without code changes) + dependency-PR-triggered
# + manually dispatchable so the scan is provable on demand.
name: vulncheck

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  pull_request:
    paths:
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulncheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go tool govulncheck ./... # tool-directive pin (v1.9.0) — never a latest-tag run
