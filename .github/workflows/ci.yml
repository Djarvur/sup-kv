# Quality gates: strict lint + 4-cell OS/arch gate matrix.
# Check-run names ("lint", "gate (<cell>)") are the required-check contexts
# recorded in the branch-protection ruleset — any matrix change is a ruleset change.
#
# TEST-05 policy: the internal/stand socket tests are non-skippable on Linux —
# a capability-probe miss is a FATAL naming the probe, never a t.Skip. The
# darwin cell (macos-15) reports the limitation through the named
# TestPlatform_darwinReplicationUntested green result, and the cross-compile
# cell builds only.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # P1-WR-01: a wedged job must not hold a runner for the 6h default
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # buf breaking resolves refs/remotes/origin/master from the local .git — a shallow checkout cannot
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # `run` silently ignores unknown top-level config keys (T-01-01): schema-check
      # the vendored strict config with the same pinned binary before linting.
      - run: go tool golangci-lint config verify
      # Buf schema gates: proto lint + format + guarded breaking vs origin/master,
      # all via the go.mod-pinned `go tool buf` binary (same as the Makefile targets).
      # The guard is required because buf v1.75 exits 1 on a proto-less against-ref
      # (probe-verified) while supkv.proto is not yet on origin/master — it
      # self-destructs the moment PR #31 merges and every later PR gets the full
      # FILE-policy comparison; the .git-dir against-input avoids any private-repo
      # token plumbing the remote-https form would need (D-08, whose permitted
      # .git#branch fallback shape is refined here by the explicit remote-tracking
      # refspec for determinism).
      - name: Buf proto schema gates (lint, format, breaking vs origin/master)
        run: |
          go tool buf lint
          go tool buf format --diff --exit-code
          if git cat-file -e refs/remotes/origin/master:internal/udprepl/replproto/supkv/v1/supkv.proto; then
            go tool buf breaking --against '.git#ref=refs/remotes/origin/master'
          else
            echo "buf breaking deferred: supkv.proto not on origin/master yet (D-08 guard)"
          fi
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0 # full patch pin == go.mod tool directive (local/CI parity)

  gate:
    name: gate (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on || matrix.name }}
    timeout-minutes: 20 # P1-WR-01: race suite + tidy bound; a hung cell fails instead of hanging the runner
    strategy:
      fail-fast: false # a red cell must not cancel the remaining cells' evidence
      matrix:
        include:
          - name: ubuntu-latest # linux/amd64 native — full gate
          - name: ubuntu-24.04-arm # linux/arm64 native — full gate
          - name: macos-15 # darwin/arm64 native — full gate
          - name: darwin-amd64-cross # cross-compile cell on Linux
            runs-on: ubuntu-latest
            goos: darwin
            goarch: amd64
            cross: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: matrix.cross
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./... && go vet ./...
      - if: ${{ !matrix.cross }}
        run: |
          go vet ./...
          # TEST-05: Linux socket tests mandatory — the stand package fails the
          # cell on any skip; runs redundantly inside ./... for a named
          # check-run entry.
          go test -race ./internal/stand/
          go test -race ./...
          go mod tidy
          git diff --exit-code go.mod go.sum
