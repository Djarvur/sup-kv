# Dependabot version updates: gomod + github-actions, weekly, grouped minor+patch.
# The tool graph is small — one grouped PR per week beats five.
# (Dependabot ALERTS are GHAS-gated on this private repo and stay off until the
# deferred public flip; version updates are active — see plan 01-03 SUMMARY.)
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Must move in lockstep with .golangci.yml (vendored 2.15.0-exact strict
      # config) and the `version:` pin in .github/workflows/ci.yml — re-vendor
      # by hand per AGENTS.md deviation #2. See WR-01 in 01-REVIEW.md.
      - dependency-name: github.com/golangci/golangci-lint/v2
    commit-message:
      prefix: go-deps
      include: scope
    open-pull-requests-limit: 10
    groups:
      gomod-safe-updates:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    open-pull-requests-limit: 10
    groups:
      actions-safe-updates:
        update-types:
          - minor
          - patch
