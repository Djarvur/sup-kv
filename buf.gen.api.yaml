# Buf codegen for the client-facing gRPC schema — same shape as
# buf.gen.repl.yaml, pinned to the apiproto tree. protoc-gen-go-grpc skips
# service-less files (the replication schema), so both plugins ride one
# pass here.
version: v2

plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: internal/grpcapi/apiproto
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: internal/grpcapi/apiproto
    opt: paths=source_relative
